<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
      </style>
      <div id="root" data-composition-id="scene2" data-width="1920" data-height="1080" data-duration="6.7">
        <div id="scene2-inner" class="scene-inner scene-light">
          <p id="s2-kicker" class="section-kicker">The Four Fragrances</p>
          <div class="cards-row">
            <article id="card-1" class="frag-card">
              <div class="card-image-wrap">
                <span class="card-pill">Focus &amp; Energy</span>
                <img src="assets/images/products/espresso.png" alt="" />
              </div>
              <div class="card-body">
                <h2 class="card-name">Espresso Ground Incense</h2>
                <div class="badge-bar">
                  <div class="badge-seg">
                    <div class="badge-label">Burn Time</div>
                    <div class="badge-value">45-50 Minutes</div>
                  </div>
                  <div class="badge-seg">
                    <div class="badge-label">Stick Count</div>
                    <div class="badge-value">33 Hand-Rolled</div>
                  </div>
                </div>
              </div>
            </article>

            <article id="card-2" class="frag-card">
              <div class="card-image-wrap">
                <span class="card-pill">Relaxation &amp; Sleep</span>
                <img src="assets/images/products/vanilla.png" alt="" />
              </div>
              <div class="card-body">
                <h2 class="card-name">Madagascan Calm Incense</h2>
                <div class="badge-bar">
                  <div class="badge-seg">
                    <div class="badge-label">Burn Time</div>
                    <div class="badge-value">45-50 Minutes</div>
                  </div>
                  <div class="badge-seg">
                    <div class="badge-label">Stick Count</div>
                    <div class="badge-value">33 Hand-Rolled</div>
                  </div>
                </div>
              </div>
            </article>

            <article id="card-3" class="frag-card">
              <div class="card-image-wrap">
                <span class="card-pill">Purification</span>
                <img src="assets/images/products/lemon.png" alt="" />
              </div>
              <div class="card-body">
                <h2 class="card-name">Citrus Clarity Incense</h2>
                <div class="badge-bar">
                  <div class="badge-seg">
                    <div class="badge-label">Burn Time</div>
                    <div class="badge-value">45-50 Minutes</div>
                  </div>
                  <div class="badge-seg">
                    <div class="badge-label">Stick Count</div>
                    <div class="badge-value">33 Hand-Rolled</div>
                  </div>
                </div>
              </div>
            </article>

            <article id="card-4" class="frag-card">
              <div class="card-image-wrap">
                <span class="card-pill">Creative Flow</span>
                <img src="assets/images/products/orange.png" alt="" />
              </div>
              <div class="card-body">
                <h2 class="card-name">Creative Spark Incense</h2>
                <div class="badge-bar">
                  <div class="badge-seg">
                    <div class="badge-label">Burn Time</div>
                    <div class="badge-value">45-50 Minutes</div>
                  </div>
                  <div class="badge-seg">
                    <div class="badge-label">Stick Count</div>
                    <div class="badge-value">33 Hand-Rolled</div>
                  </div>
                </div>
              </div>
            </article>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        // Entrance crossfade — first 0.7s of this scene's window.
        tl.fromTo("#scene2-inner", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.inOut" }, 0);
        tl.fromTo("#s2-kicker", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.3);
        // Cards reveal via a rising clip-path wipe (no opacity fade) so badge text is always
        // either fully hidden or at full resting contrast — never sampled mid-fade at low alpha.
        const cardIds = ["#card-1", "#card-2", "#card-3", "#card-4"];
        const cardStarts = [0.5, 0.75, 1.0, 1.25];
        cardIds.forEach((id, i) => {
          tl.fromTo(
            id,
            { clipPath: "inset(100% 0 0 0)" },
            { clipPath: "inset(0% 0 0 0)", duration: 0.65, ease: "power2.out" },
            cardStarts[i],
          );
        });
        // Exit crossfade — last 0.7s of this scene's 6.7s window.
        tl.fromTo(
          "#scene2-inner",
          { opacity: 1 },
          { opacity: 0, duration: 0.7, ease: "power1.inOut", immediateRender: false },
          6.0,
        );
        window.__timelines["scene2"] = tl;
      </script>
    </template>
  </body>
</html>

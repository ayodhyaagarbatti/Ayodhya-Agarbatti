<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
      </style>
      <div id="root" data-composition-id="scene4" data-width="1920" data-height="1080" data-duration="4">
        <div id="scene4-inner" class="scene-inner scene-dark">
          <img id="scene4-bg-img" class="bg-image" src="assets/images/ritual_bg.png" alt="" />
          <div class="bg-gradient-maroon"></div>
          <div class="bg-vignette"></div>
          <div class="hook-content">
            <h1 id="s4-wordmark" class="wordmark-gold outro-mark">Ayodhya Agarbatti</h1>
            <p id="s4-tagline" class="outro-tagline">Where prayer meets purity.</p>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        // Entrance crossfade — first 0.7s of this scene's window.
        tl.fromTo("#scene4-inner", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.inOut" }, 0);
        tl.fromTo(
          "#s4-wordmark",
          { opacity: 0, scale: 1.08 },
          { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" },
          0.4,
        );
        tl.fromTo(
          "#s4-tagline",
          { opacity: 0, y: -8 },
          { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" },
          0.9,
        );
        // Final scene — no exit fade, holds to the end of the composition.
        window.__timelines["scene4"] = tl;
      </script>
    </template>
  </body>
</html>
